name: Build & Publish Docker Images and SDK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  docker:
    name: Build and push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'apps/server/**'
            admin:
              - 'apps/admin/**'
            shared:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/docker-and-sdk.yml'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push server image
        if: steps.changes.outputs.server == 'true' || steps.changes.outputs.shared == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=litetrack-server
          cache-to: type=gha,mode=max,scope=litetrack-server
          tags: |
            boses/litetrack-server:latest
            boses/litetrack-server:${{ github.sha }}

      - name: Build and push admin image
        if: steps.changes.outputs.admin == 'true' || steps.changes.outputs.shared == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=litetrack-admin
          cache-to: type=gha,mode=max,scope=litetrack-admin
          tags: |
            boses/litetrack-admin:latest
            boses/litetrack-admin:${{ github.sha }}

      - name: Skip Docker build when no relevant changes
        if: steps.changes.outputs.server != 'true' && steps.changes.outputs.admin != 'true' && steps.changes.outputs.shared != 'true'
        run: echo "No changes for server/admin/shared, skip building Docker images."

  sdk:
    name: Build SDK and publish to admin/public
    runs-on: ubuntu-latest
    # SDK 发版与 Docker 构建并行，互不阻塞
    permissions:
      contents: write
      id-token: write  # npm provenance 溯源发布所需

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Build SDK
        run: pnpm -C apps/sdk build

      - name: Read SDK version
        id: sdk_version
        run: echo "version=$(node -p "require('./apps/sdk/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish versioned SDK + update manifest
        run: node apps/sdk/scripts/publish.mjs

      - name: Commit and push if changed
        run: |
          VERSION="${{ steps.sdk_version.outputs.version }}"
          if git status --porcelain apps/admin/public/sdk | grep .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/public/sdk
            git commit -m "chore: publish sdk v${VERSION}"
            git push
          else
            echo "SDK v${VERSION} already published, skipping commit."
          fi

      # OIDC 可信发布需 npm >= 11.5.1，Node 内置版本可能偏旧，这里强制升级
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Publish to npm (trusted publishing + provenance)
        # 走 Trusted Publishing：不传 NODE_AUTH_TOKEN，由 id-token 自动鉴权
        run: |
          VERSION="${{ steps.sdk_version.outputs.version }}"
          PUBLISHED=$(npm view @boses/litetrack-sdk@${VERSION} version 2>/dev/null || echo "")
          if [ -z "$PUBLISHED" ]; then
            npm publish --provenance --access public
            echo "Published @boses/litetrack-sdk@${VERSION} to npm"
          else
            echo "@boses/litetrack-sdk@${VERSION} already exists on npm, skipping"
          fi
        working-directory: apps/sdk
