name: Verify and Release
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      publish_sdk:
        description: '恢复当前 SDK 版本的发布（必须已有正式 GitHub Release）'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: litetrack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: litetrack
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: litetrack_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U litetrack -d litetrack_test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://litetrack:test_password@127.0.0.1:5432/litetrack_test
      TEST_DATABASE_URL: postgresql://litetrack:test_password@127.0.0.1:5432/litetrack_test
      REDIS_URL: redis://127.0.0.1:6379/14
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      JWT_SECRET: ci-test-secret-not-used-in-production-123456
      PUBLIC_URL: http://localhost:8080
      HOST: 127.0.0.1
      PORT: 3000
      SCREENSHOT_DIR: /tmp/litetrack-browser
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Require major version for the rewrite
        run: node apps/sdk/scripts/check-release.mjs --preview
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter server db:generate
      - run: pnpm --filter server db:migrate
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpm audit --prod
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @boses/litetrack-sdk check-package
      - run: pnpm --filter @boses/litetrack-sdk pack --pack-destination "$RUNNER_TEMP/sdk-package"
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-package
          path: ${{ runner.temp }}/sdk-package/*.tgz
      - run: pnpm --filter server exec playwright install --with-deps chromium
      - name: Browser acceptance
        run: |
          pnpm --filter server start >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          pnpm --filter admin exec rsbuild preview --port 8080 >/tmp/admin.log 2>&1 &
          ADMIN_PID=$!
          trap 'kill "$SERVER_PID" "$ADMIN_PID" 2>/dev/null || true' EXIT
          pnpm --filter server test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: apps/sdk/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: /tmp/litetrack-browser

  release-please:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs['apps/sdk--release_created'] == 'true' || steps.resume.outputs.released == 'true' }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-github-pull-request: ${{ inputs.publish_sdk || false }}
      - uses: actions/checkout@v4
      - name: Resume an existing SDK release
        id: resume
        if: inputs.publish_sdk && steps.release.outputs['apps/sdk--release_created'] != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          node apps/sdk/scripts/check-release.mjs
          VERSION=$(node -p "require('./apps/sdk/package.json').version")
          TAG="v$VERSION"
          test "$(gh release view "$TAG" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true
          git fetch --depth=1 origin "refs/tags/$TAG:refs/tags/$TAG"
          # 不能以旧版本号发布 tag 之后改动过的 SDK。
          git diff --exit-code "$TAG" HEAD -- apps/sdk pnpm-lock.yaml
          echo 'released=true' >> "$GITHUB_OUTPUT"
      - name: Reject untagged merged release PRs
        if: steps.release.outputs['apps/sdk--release_created'] != 'true' && steps.resume.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          PENDING=$(gh pr list --state merged --base "$DEFAULT_BRANCH" --label 'autorelease: pending' --limit 1 --json number --jq length)
          if [ "$PENDING" != 0 ]; then
            echo '::error::Merged release PR has no tag/Release; recover release-please before publishing.'
            exit 1
          fi

  sdk-assets:
    needs: [verify, release-please]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @litetrack/contracts build
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: apps/sdk/dist
      - run: node apps/sdk/scripts/publish.mjs
      - name: Persist immutable CDN assets
        run: |
          if [ -n "$(git status --porcelain apps/admin/public/sdk)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/admin/public/sdk
            git commit -m "chore: append released sdk assets"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-public
          path: apps/admin/public/sdk

  docker:
    needs: [verify, release-please, sdk-assets]
    if: always() && github.event_name != 'pull_request' && needs.verify.result == 'success' && needs.release-please.result == 'success' && (needs.sdk-assets.result == 'success' || needs.sdk-assets.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.sdk-assets.result == 'success'
        with:
          name: sdk-public
          path: apps/admin/public/sdk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: boses/litetrack-server:latest,boses/litetrack-server:${{ github.sha }}
          cache-from: type=gha,scope=litetrack-server
          cache-to: type=gha,mode=max,scope=litetrack-server
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/admin/Dockerfile
          platforms: linux/amd64
          push: true
          tags: boses/litetrack-admin:latest,boses/litetrack-admin:${{ github.sha }}
          cache-from: type=gha,scope=litetrack-admin
          cache-to: type=gha,mode=max,scope=litetrack-admin

  npm:
    needs: [verify, sdk-assets, docker]
    if: needs.sdk-assets.result == 'success'
    runs-on: ubuntu-latest
    # 保留 OIDC 发布身份；此环境不等待服务器部署审批。
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11
      - uses: actions/download-artifact@v4
        with:
          name: sdk-package
          path: /tmp/sdk-package
      - run: npm publish --dry-run /tmp/sdk-package/*.tgz
      - run: npm publish /tmp/sdk-package/*.tgz --provenance --access public
