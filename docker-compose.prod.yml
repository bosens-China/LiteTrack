services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litetrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: litetrack_core
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U litetrack -d litetrack_core']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  server:
    image: ${SERVER_IMAGE:-litetrack-core-server:local}
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://litetrack:${POSTGRES_PASSWORD}@postgres:5432/litetrack_core
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      # 后端不暴露端口，只信任私网入口；Nginx 覆盖客户端转发链。
      TRUST_PROXY: uniquelocal
    restart: unless-stopped
  admin:
    image: ${ADMIN_IMAGE:-litetrack-core-admin:local}
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    environment:
      LITETRACK_API_UPSTREAM: server:3000
    ports:
      - '${HTTP_PORT:-8080}:80'
    restart: unless-stopped
volumes:
  postgres_core_data:
