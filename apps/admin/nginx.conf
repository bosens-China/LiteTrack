# OAuth 回调查询参数含 code / state，入口日志也只记录不带查询参数的 URI。
log_format litetrack '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log litetrack;

  root /usr/share/nginx/html;
  index index.html;

  # 基础安全响应头
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # 压缩文本资源，减少带宽
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  # 反向代理 /litetrack 前缀到后端服务（通过 envsubst 注入上游地址）
  location /litetrack/ {
    # 处理 CORS 预检请求 (OPTIONS)
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Site-Token,X-LiteTrack-SDK' always;
        add_header 'Access-Control-Max-Age' 1728000 always;
        add_header 'Content-Type' 'text/plain; charset=utf-8' always;
        add_header 'Content-Length' 0 always;
        return 204;
    }

    # 注意不要在 proxy_pass 后加 /，否则会丢失 /litetrack 前缀
    proxy_pass http://${LITETRACK_API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # 当前 Nginx 是外部请求入口，覆盖客户端自填转发链，避免伪造 IP 绕过限流。
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 默认没有可信地理头来源，剥离客户端自填值，后端使用离线 IP 定位。
    proxy_set_header CF-IPCountry "";
    proxy_set_header X-Geo-Country "";
    proxy_set_header X-Geo-City "";
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_connect_timeout 10s;
  }

  # 对构建产物启用长缓存（文件名带 hash）
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    access_log off;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
