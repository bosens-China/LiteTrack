# 不记录 OAuth code、state 或任何查询参数。
log_format litetrack '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log litetrack;
  root /usr/share/nginx/html;
  index index.html;
  add_header_inherit merge;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  gzip on;
  gzip_types text/css application/json application/javascript image/svg+xml;

  location ^~ /litetrack/ {
    proxy_pass http://${LITETRACK_API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;
    client_max_body_size 16k;
  }
  location ^~ /sdk/preview/ {
    types {
      application/javascript js mjs;
      text/plain mts;
      application/json json map;
    }
    add_header Cache-Control "no-store";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  location = /sdk/current.json {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  location = /sdk/manifest.json {
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  location ^~ /sdk/ {
    types {
      application/javascript js mjs;
      text/plain mts;
      application/json json map;
    }
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  location ~* \.(?:js|mjs|css|png|jpg|svg|ico|webp|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
