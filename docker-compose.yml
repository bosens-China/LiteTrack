services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litetrack
      POSTGRES_PASSWORD: litetrack_password
      POSTGRES_DB: litetrack_core
    ports:
      - '127.0.0.1:25434:5432'
    volumes:
      - postgres_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U litetrack -d litetrack_core']
      interval: 3s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:26381:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  postgres_core_data:
