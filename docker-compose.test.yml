services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litetrack
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: litetrack_test
    ports: ['127.0.0.1:25433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U litetrack -d litetrack_test']
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:26380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
